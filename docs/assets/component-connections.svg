<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Home energy optimizer architecture</title>
<desc id="diagram-desc">Home Assistant, Prometheus, published energy prices and weather, and configuration feed the shared data and feature layer. The battery path combines load forecast, price outlook, and battery model in a dispatch optimizer to produce a battery plan. In parallel, the climate path combines thermal and heat pump electricity models in a climate optimizer to produce an advisory climate plan. The two optimizers share data but currently have no direct planner-to-planner link.</desc>
<defs>
<linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081728"/><stop offset="1" stop-color="#17293d"/></linearGradient>
<linearGradient id="battery" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173a56"/><stop offset="1" stop-color="#10283d"/></linearGradient>
<linearGradient id="climate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b463b"/><stop offset="1" stop-color="#122d30"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8caabe"/></marker>
<marker id="battery-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#58bceb"/></marker>
<marker id="climate-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6fdfad"/></marker>
<style>
