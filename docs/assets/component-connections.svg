.heading{font-size:38px;font-weight:800;fill:#f4f9ff;letter-spacing:.25px}
.subtitle{font-size:19px;fill:#9cb3cb}
.section{font-size:26px;font-weight:800;letter-spacing:1.5px}
.title{font-size:23px;font-weight:800;fill:#f3f7ff}
.detail{font-size:19px;fill:#afc3d5}
.small{font-size:17px;fill:#9eb5c8}
.center{text-anchor:middle}
.path{stroke:#8caabe;stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.path-battery{stroke:#58bceb;stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
.path-climate{stroke:#6fdfad;stroke-width:3;fill:none;stroke-linejoin:round;stroke-linecap:round}
</style></defs>
