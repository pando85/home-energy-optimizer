name: Set up uv
description: Install the pinned uv version and a Python interpreter. The single place the CI uv version is pinned.

inputs:
  python-version:
    description: Python version to install.
    default: "3.14"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        # Renovate updates this input natively (github-actions manager).
        version: 0.13.5
        python-version: ${{ inputs.python-version }}
        enable-cache: true
